name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ruff
        run: pip install "ruff>=0.6,<1"

      - name: Gate (lint, format, secret scan, tests)
        run: scripts/check.sh

  validate:
    # Runs the same checks the catalog CI runs, against the latest Hermes release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"  # Hermes pins its dependencies for 3.14

      - name: Install Hermes
        # Hermes cannot be pip-installed as a wheel (and PyPI's copy is old):
        # clone the release tag and install it editable.
        run: |
          git clone --depth 1 --branch v0.22.2 https://github.com/NousResearch/hermes-agent "$RUNNER_TEMP/hermes"
          pip install -e "$RUNNER_TEMP/hermes"

      - name: Validate both plugins
        run: |
          for d in hyai-router model-providers/hostyourai; do
            hermes plugins validate "$d" --install-deps
          done

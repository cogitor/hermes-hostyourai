name: hostyourai
kind: standalone
version: 0.4.0
manifest_version: 2
requires_hermes: ">=0.21.7"
description: HostYourAI provider profile (hyai/auto router) and /hyai task/policy routing command
author: cogitor
license: MIT
homepage: https://github.com/cogitor/hermes-hostyourai
tags: [model-provider, slash-command, hostyourai, routing]
provides_hooks: [pre_llm_call]
provides_middleware: [llm_request]
requires_env:
  - name: HOSTYOURAI_API_KEY
    description: "HostYourAI API key"
    url: "https://hostyourai.com"
    secret: true
